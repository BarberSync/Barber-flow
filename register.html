<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>barber-flow - تسجيل حلاق جديد</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1a1a1a; --gold: #d4af37; --white: #ffffff; --gray: #333; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--primary); color: var(--white); margin: 0; padding: 0; }
        
        .container { 
            width: 100%; 
            min-height: 100vh; 
            background: #222; 
            padding: 40px 20px; 
            box-sizing: border-box; 
        }

        .back-link { display: block; margin-bottom: 20px; color: var(--gold); text-decoration: none; font-weight: bold; }
        h2 { text-align: center; color: var(--gold); font-size: 1.8rem; margin-bottom: 30px; }

        input[type="text"], input[type="tel"], input[type="password"] { 
            width: 100%; padding: 16px; margin: 10px 0; border-radius: 12px; border: 1px solid #444; 
            background: var(--gray); color: white; font-family: 'Cairo'; box-sizing: border-box; font-size: 1rem;
        }

        /* تنسيق زر رفع الصور */
        .upload-wrapper { margin: 20px 0; }
        .custom-file-upload {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 100%; min-height: 100px; border: 2px dashed var(--gold); border-radius: 15px;
            cursor: pointer; background: rgba(212, 175, 55, 0.05); transition: 0.3s; padding: 10px; box-sizing: border-box;
        }
        .custom-file-upload span { color: var(--gold); font-weight: bold; margin-top: 5px; }
        #imageInput { display: none; }

        /* شبكة الصور الذكية - تستوعب أي عدد */
        #preview { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); 
            gap: 10px; 
            margin-top: 20px; 
        }
        #preview img { 
            width: 100%; 
            height: 90px; 
            object-fit: cover; 
            border-radius: 10px; 
            border: 1px solid var(--gold);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        #submitBtn { 
            width: 100%; padding: 18px; margin-top: 30px; border-radius: 12px; border: none;
            background: var(--gold); color: var(--primary); font-weight: bold; font-size: 1.1rem; 
            cursor: pointer; font-family: 'Cairo';
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-link">← العودة للرئيسية</a>
        <h2>انضم إلى barber-flow 💈</h2>
        
        <input type="text" id="shopName" placeholder="اسم الصالون">
        <input type="text" id="address" placeholder="العنوان (المدينة - الحي)">
        <input type="tel" id="phone" placeholder="رقم الواتساب">
        <input type="password" id="password" placeholder="كلمة المرور">
        
        <div class="upload-wrapper">
            <label for="imageInput" class="custom-file-upload">
                <span style="font-size: 2rem;">📸</span>
                <span>إضافة صور معرض الأعمال (عدد غير محدود)</span>
            </label>
            <input type="file" id="imageInput" multiple accept="image/*">
            <div id="preview"></div> 
        </div>

        <button id="submitBtn">إنشاء حسابي الآن</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // الاتصال بقاعدتك الأصلية
        const firebaseConfig = { 
            apiKey: "AIzaSyAeOxiKYc-DLSe5VnswhdkwVIwCyL6LbSg", 
            authDomain: "barerflow.firebaseapp.com", 
            projectId: "barerflow", 
            appId: "1:860226335215:web:d5d5c684c8cd781833861a" 
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        // ميزة المعاينة لعدد كبير من الصور
        document.getElementById("imageInput").onchange = async (e) => {
            const preview = document.getElementById("preview");
            preview.innerHTML = ""; // مسح القديم
            const files = e.target.files;
            
            for (let file of files) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = document.createElement("img");
                    img.src = event.target.result;
                    preview.appendChild(img);
                }
                reader.readAsDataURL(file);
            }
        };

        document.getElementById("submitBtn").onclick = async () => {
            const shopName = document.getElementById("shopName").value;
            const phone = document.getElementById("phone").value;
            const files = document.getElementById("imageInput").files;

            if(!shopName || !phone || files.length === 0) {
                alert("يرجى ملء البيانات واختيار الصور!");
                return;
            }

            try {
                const imageUrls = [];
                for (let file of files) {
                    const base64 = await toBase64(file);
                    imageUrls.push(base64);
                }

                await addDoc(collection(db, "barbers"), {
                    shopName, phone, 
                    address: document.getElementById("address").value,
                    password: document.getElementById("password").value,
                    images: imageUrls,
                    createdAt: new Date()
                });

                alert("تم التسجيل بنجاح بنجاح!");
                window.location.href = "dashboard.html";
            } catch (e) {
                alert("حدث خطأ، تأكد من جودة الإنترنت.");
            }
        };
    </script>
</body>
</html>
